{% set name = "uncalled-for" %}
{% set version = "0.4.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 6412b19d1b1e7d431981fee01f8b47be7802f48328a48cbe9603acee757ec553

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<310]

requirements:
  host:
    - python
    - pip
    - hatchling
    - hatch-vcs
  run:
    - python

test:
  source_files:
    - tests
  imports:
    - uncalled_for
  requires:
    - pip
    - pytest
    - pytest-asyncio
  commands:
    - pip check
    - pytest -vv tests -o asyncio_mode=auto

about:
  home: https://github.com/chrisguidry/uncalled-for
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Async dependency injection for Python functions
  description: |
    A small, focused dependency injection toolkit for async Python functions,
    extracted from the common bits of Docket and FastMCP.
  dev_url: https://github.com/chrisguidry/uncalled-for
  doc_url: https://github.com/chrisguidry/uncalled-for

extra:
  recipe-maintainers:
    - chrisguidry
    - zzstoatzz
